
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipboard
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipboard -d shipboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  api:
    build:
      context: ./src/ShipBoard.Api
    environment:
      ConnectionStrings__shipboard: Host=db;Port=5432;Database=shipboard;Username=shipboard;Password=shipboard
      OTEL_SERVICE_NAME: shipboard-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_URL: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
